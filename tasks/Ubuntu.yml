---
- name: Install prerequisite packages
  ansible.builtin.apt:
    pkg:
      - ca-certificates
      - curl
      - apt-transport-https
    install_recommends: true
    update_cache: true
    state: present

- name: Remove old conflicting versions
  ansible.builtin.apt:
    pkg:
      - docker.io
      - docker-doc
      - docker-compose
      - docker-compose-v2
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Get dpkg architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false
  check_mode: false

- name: Set apt_architecture fact
  ansible.builtin.set_fact:
    apt_architecture: "{{ dpkg_arch.stdout }}"

- name: Add docker repository (Ubuntu <= 24.04)
  when: ansible_facts['distribution_major_version'] | int <= 24
  block:
    - name: Create /etc/apt/keyrings directory with correct permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add docker repository
      ansible.builtin.apt_repository:
        repo: >
          deb [arch={{ apt_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_facts['distribution_release'] }} stable
        state: present
        filename: docker

- name: Add Docker repository (Ubuntu > 24.04)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "https://download.docker.com/linux/ubuntu"
    architectures: "{{ apt_architecture }}"
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present
    enabled: true
  when: ansible_facts['distribution_major_version'] | int > 24

- name: Install docker packages
  ansible.builtin.apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    install_recommends: true
    update_cache: true
    state: present

- name: Copy daemon.json file
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: Restart docker

- name: Enable and start docker service
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
...
